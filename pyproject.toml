[project]
name = "vgpu-local"
version = "0.1.0a0"
description = "Local GPU pools, reusable capacity adapters, and opt-in cloud overflow"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "rfc8785==0.1.4",
    "jsonschema==4.26.0",
    "keyring==25.7.0",
    "filelock==4.0.12",
]

[project.scripts]
vgpu-local = "vgpu_local.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest==8.4.2", "datamodel-code-generator[black,isort]==0.83.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/vgpu_local"]
