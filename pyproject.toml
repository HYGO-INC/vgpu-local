[project]
name = "vgpu-local"
version = "0.1.0a0"
description = "Small local GPU runtime with optional hosted management"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[project.scripts]
vgpu-local = "vgpu_local.cli:main"

[project.optional-dependencies]
control = ["pydantic==2.13.5", "rfc8785==0.1.4", "filelock==4.0.12"]
cloud = ["vgpu-local[control]", "httpx==0.28.1", "keyring==25.7.0"]
kubernetes = ["vgpu-local[control]", "kubernetes==35.0.0"]
runtime = ["vgpu-local[control]", "httpx==0.28.1", "starlette==1.9.0", "uvicorn==0.54.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest==8.4.2", "datamodel-code-generator[black,isort]==0.83.0",
       "jsonschema==4.26.0", "rfc8785==0.1.4", "filelock==4.0.12",
       "httpx==0.28.1", "keyring==25.7.0", "starlette==1.9.0", "uvicorn==0.54.0"]
browser = ["playwright==1.63.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/vgpu_local"]

[tool.hatch.build.targets.sdist]
only-include = ["src/vgpu_local", "pyproject.toml", "README.md", "LICENSE", "NOTICE", ".gitignore"]
