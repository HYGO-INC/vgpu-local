output-dir: "{project-root}/generated"
emit:
  - "@typespec/openapi3"
  - "@typespec/json-schema"
options:
  "@typespec/openapi3":
    emitter-output-dir: "{output-dir}"
    openapi-versions: ["3.1.0"]
    file-type: json
    output-file: openapi.json
    seal-object-schemas: true
  "@typespec/json-schema":
    emitter-output-dir: "{output-dir}"
    file-type: json
    bundleId: resources.json
    emitAllModels: true
    seal-object-schemas: true
    int64-strategy: number
