[project]
name = "vgpu-framepack-qualification"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "torch==2.6.0+cu126",
  "torchvision==0.21.0+cu126",
  "torchaudio==2.6.0+cu126",
  "accelerate==1.6.0",
  "diffusers==0.33.1",
  "transformers==4.46.2",
  "gradio==5.23.0",
  "pillow==11.1.0",
  "av==12.1.0",
  "numpy==1.26.2",
  "scipy==1.12.0",
  "requests==2.31.0",
  "torchsde==0.2.6",
  "sentencepiece==0.2.0",
  "einops==0.8.1",
  "opencv-contrib-python==4.11.0.86",
  "huggingface-hub==0.30.2",
  "safetensors>=0.5.3,<1",
  "psutil>=7,<8",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' or sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
